<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="b" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b5bb5"/></marker><marker id="o" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c77a00"/></marker></defs>
<text x="20" y="44" font-size="26" font-weight="bold">Архитектура экранного доступа Android (TalkBack + Chrome)</text>
<rect x="20" y="70" width="190" height="240" rx="10" fill="#eaf7ea" stroke="#2e7d32" stroke-width="2"/>
<text x="32" y="96" font-size="17" font-weight="bold">Пользователь</text>
<text x="32" y="121" font-size="14">Жесты на сенсорном</text>
<text x="32" y="139" font-size="14">экране: смахивания,</text>
<text x="32" y="157" font-size="14">исследование</text>
<text x="32" y="175" font-size="14">касанием, двойное</text>
<text x="32" y="193" font-size="14">касание, меню TalkBack</text>
<text x="32" y="217" font-size="12" fill="#555">Обратно: речь, звуки,</text>
<text x="32" y="232" font-size="12" fill="#555">вибрация, брайль</text>
<rect x="300" y="70" width="190" height="240" rx="10" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="312" y="96" font-size="17" font-weight="bold">Сенсорный экран,</text>
<text x="312" y="117" font-size="17" font-weight="bold">InputManager</text>
<text x="312" y="142" font-size="14">В режиме «Исследование</text>
<text x="312" y="160" font-size="14">касанием» касания</text>
<text x="312" y="178" font-size="14">сначала получает</text>
<text x="312" y="196" font-size="14">служба доступности,</text>
<text x="312" y="214" font-size="14">а не приложение</text>
<rect x="580" y="70" width="190" height="240" rx="10" fill="#fff1dc" stroke="#c77a00" stroke-width="2"/>
<text x="592" y="96" font-size="17" font-weight="bold">TalkBack —</text>
<text x="592" y="117" font-size="17" font-weight="bold">клиент доступности</text>
<text x="592" y="142" font-size="14">AccessibilityService</text>
<text x="592" y="160" font-size="14">(Android Accessibility</text>
<text x="592" y="178" font-size="14">Suite)</text>
<text x="592" y="202" font-size="12" fill="#555">Аналог: NVDA / Экранный</text>
<text x="592" y="217" font-size="12" fill="#555">диктор (Windows), Orca</text>
<text x="592" y="232" font-size="12" fill="#555">(Linux), VoiceOver (macOS)</text>
<rect x="1010" y="70" width="190" height="240" rx="10" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="1022" y="96" font-size="17" font-weight="bold">Платформенный</text>
<text x="1022" y="117" font-size="17" font-weight="bold">слой</text>
<text x="1022" y="142" font-size="14">AccessibilityManager /</text>
<text x="1022" y="160" font-size="14">system_server;</text>
<text x="1022" y="178" font-size="14">дерево узлов</text>
<text x="1022" y="196" font-size="14">AccessibilityNodeInfo</text>
<text x="1022" y="220" font-size="12" fill="#555">Аналог: UI Automation</text>
<text x="1022" y="235" font-size="12" fill="#555">(Windows), AT-SPI2 +</text>
<text x="1022" y="250" font-size="12" fill="#555">D-Bus (Linux),</text>
<text x="1022" y="265" font-size="12" fill="#555">NSAccessibility (macOS)</text>
<rect x="1290" y="70" width="190" height="240" rx="10" fill="#e6f0ff" stroke="#2b5bb5" stroke-width="2"/>
<text x="1302" y="96" font-size="17" font-weight="bold">Приложение —</text>
<text x="1302" y="117" font-size="17" font-weight="bold">поставщик</text>
<text x="1302" y="142" font-size="14">Chrome: DOM → дерево</text>
<text x="1302" y="160" font-size="14">доступности Blink →</text>
<text x="1302" y="178" font-size="14">виртуальные узлы</text>
<text x="1302" y="196" font-size="14">AccessibilityNodeInfo</text>
<text x="1302" y="214" font-size="14">Нативное: Views /</text>
<text x="1302" y="232" font-size="14">Compose semantics</text>
<text x="1302" y="256" font-size="12" fill="#555">Аналог: UIA Provider,</text>
<text x="1302" y="271" font-size="12" fill="#555">ATK/AT-SPI в</text>
<text x="1302" y="286" font-size="12" fill="#555">приложении</text>
<text x="255.0" y="172" font-size="11" fill="#2b5bb5" text-anchor="middle">касания</text>
<line x1="214" y1="180" x2="296" y2="180" stroke="#2b5bb5" stroke-width="2" marker-end="url(#b)"/>
<line x1="296" y1="194" x2="214" y2="194" stroke="#c77a00" stroke-width="2" marker-end="url(#o)"/>
<text x="255.0" y="210" font-size="11" fill="#c77a00" text-anchor="middle">речь, вибро,</text>
<text x="255.0" y="223" font-size="11" fill="#c77a00" text-anchor="middle">брайль</text>
<text x="535.0" y="172" font-size="11" fill="#2b5bb5" text-anchor="middle">жесты</text>
<line x1="494" y1="180" x2="576" y2="180" stroke="#2b5bb5" stroke-width="2" marker-end="url(#b)"/>
<line x1="576" y1="194" x2="494" y2="194" stroke="#c77a00" stroke-width="2" marker-end="url(#o)"/>
<text x="535.0" y="210" font-size="11" fill="#c77a00" text-anchor="middle">TTS, брайль</text>
<text x="890.0" y="146" font-size="11" fill="#2b5bb5" text-anchor="middle">запрос узлов и свойств;</text>
<text x="890.0" y="159" font-size="11" fill="#2b5bb5" text-anchor="middle">performAction: CLICK,</text>
<text x="890.0" y="172" font-size="11" fill="#2b5bb5" text-anchor="middle">SET_TEXT, SCROLL_FORWARD</text>
<line x1="774" y1="180" x2="1006" y2="180" stroke="#2b5bb5" stroke-width="2" marker-end="url(#b)"/>
<line x1="1006" y1="194" x2="774" y2="194" stroke="#c77a00" stroke-width="2" marker-end="url(#o)"/>
<text x="890.0" y="210" font-size="11" fill="#c77a00" text-anchor="middle">AccessibilityEvent:</text>
<text x="890.0" y="223" font-size="11" fill="#c77a00" text-anchor="middle">TYPE_VIEW_ACCESSIBILITY_FOCUSED</text>
<text x="890.0" y="236" font-size="11" fill="#c77a00" text-anchor="middle">TYPE_VIEW_TEXT_CHANGED</text>
<text x="890.0" y="249" font-size="11" fill="#c77a00" text-anchor="middle">TYPE_WINDOW_STATE_CHANGED</text>
<text x="890.0" y="262" font-size="11" fill="#c77a00" text-anchor="middle">TYPE_WINDOW_CONTENT_CHANGED</text>
<text x="1245.0" y="159" font-size="11" fill="#2b5bb5" text-anchor="middle">запросы</text>
<text x="1245.0" y="172" font-size="11" fill="#2b5bb5" text-anchor="middle">свойств</text>
<line x1="1204" y1="180" x2="1286" y2="180" stroke="#2b5bb5" stroke-width="2" marker-end="url(#b)"/>
<line x1="1286" y1="194" x2="1204" y2="194" stroke="#c77a00" stroke-width="2" marker-end="url(#o)"/>
<text x="1245.0" y="210" font-size="11" fill="#c77a00" text-anchor="middle">узлы,</text>
<text x="1245.0" y="223" font-size="11" fill="#c77a00" text-anchor="middle">события</text>
<rect x="580" y="345" width="430" height="110" rx="10" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="592" y="371" font-size="17" font-weight="bold">Text-to-Speech (Google TTS / движок</text>
<text x="592" y="392" font-size="17" font-weight="bold">производителя)</text>
<text x="592" y="417" font-size="14">Речевой вывод, вызывается TalkBack</text>
<text x="592" y="441" font-size="12" fill="#555">Аналог: SAPI / OneCore (Windows), Speech Dispatcher (Linux)</text>
<rect x="1040" y="345" width="340" height="110" rx="10" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="1052" y="371" font-size="17" font-weight="bold">Брайлевский дисплей</text>
<text x="1052" y="392" font-size="17" font-weight="bold">(необязательно)</text>
<text x="1052" y="417" font-size="14">Bluetooth / USB, драйвер встроен в TalkBack</text>
<text x="1052" y="441" font-size="12" fill="#555">Аналог: драйверы брайля NVDA / BRLTTY</text>
<line x1="640" y1="310" x2="640" y2="343" stroke="#c77a00" stroke-width="2" marker-end="url(#o)"/>
<path d="M 720 310 L 720 327 L 1200 327 L 1200 343" fill="none" stroke="#c77a00" stroke-width="2" marker-end="url(#o)"/>
<text x="20" y="500" font-size="15"><tspan fill="#2b5bb5">→ синие стрелки</tspan> — запросы свойств и действия в сторону приложения;  <tspan fill="#c77a00">← оранжевые</tspan> — уведомления об изменениях и вывод в сторону пользователя.</text>
</svg>